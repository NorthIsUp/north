[tools]
pkl        = "latest"
pre-commit = "latest"
python     = "3.13"
uv         = "latest"
hk         = "latest"
ruff       = "latest"
prettier   = "latest"
node       = "latest"
[settings]
experimental = true

[env]
UV_PREVIEW = "1"

[tasks.uv-sync]
description = "Sync uv workspace"
run = """#!/usr/bin/env zsh
for file in packages/*/pyproject.toml ; do
    pdir=${file:h}
    [[ -d $pdir ]] || exit 1
    print -Pu2 "%F{blue}+> syncing ${pdir:t}...%f"
    uv sync --directory ${pdir} --color=always 2>&1 | awk '{print "  "$0}' || {
        print -Pu2 "%F{red}+> uv sync failled, cleaning%f"
        rm -rf ${pdir}/.venv
    }
done
"""

[tasks.test]
description = "Run ALL tests (including broken ones)"
run         = "uv run pytest"

[tasks.test-package]
description = "Run tests for a specific package (e.g., mise run test-package we-love-matchbox)"
run         = "uv run pytest packages/{{arg()}}/src/ -v"

[tasks.update-config]
description = "Update we-love package configuration"
run         = "./scripts/update_we_love_config.py"

[tasks.bump-patch]
description = "Bump the patch version of a specific package (e.g., mise run bump-patch string)"
run = """#!/usr/bin/env zsh
package={{arg()}}
uv version --bump patch --package $package --directory packages/${package//_/-}
"""

[tasks.build-package]
wait_for = ["bump-patch"]
description = "Build a specific package into root dist directory (e.g., mise run build-package we-love-string)"
run = """
set -x
package={{arg()}}
uv build --package $package --out-dir dist --directory packages/${package//_/-} """

[tasks.current-version]
description = "Get the current version of a specific package (e.g., mise run current-version we-love-string)"
run = """#!/usr/bin/env zsh
package={{arg()}}
case $package in
    we-love-*) ;;
    we_love_*) package=${package//_/-} ;;
    *) package=we-love-${package} ;;
esac
uv version --short --package $package --directory packages/$package 2>/dev/null
"""

[tasks.published-version]
description = "Get the published version of a specific package (e.g., mise run published-version we-love-string)"
run = """#!/usr/bin/env zsh
package={{arg()}}
case $package in
    we-love-*) ;;
    we_love_*) package=${package//_/-} ;;
    *) package=we-love-${package} ;;
esac
uvx get_pypi_latest_version $package 2>/dev/null || true
"""

[tasks.publish]
description = "Build and publish a specific package (e.g., mise run publish string)"
shell = "/bin/zsh"
run = """#!/usr/bin/env zsh
set -euo pipefail

case $1 in
    we-love-*) name_dash=$1 ;;
    we_love_*) name_dash=${1//_/-} ;;
    *) name_dash=we-love-${1} ;;
esac
name_under=${name_dash//-/_}

published_version=$(mise run published-version $name_dash)
local_version=$(mise run current-version $name_dash)

print -Pu2 "%F{blue}package: $1%f"
print -Pu2 "%F{blue}    | name_dash         : $name_dash%f"
print -Pu2 "%F{blue}    | name_under        : $name_under%f"
print -Pu2 "%F{blue}    | published_version : $published_version%f"
print -Pu2 "%F{blue}    | local_version     : $local_version%f"

[[ $published_version == $local_version ]] && {
    print -Pu2 "%F{green}✓ Package $name_dash is up to date, exiting%f"
    exit 0
}

[[ $published_version > $local_version ]] && {
    print -Pu2 "%F{red}✗ Package $name_dash is behind the latest published version, exiting%f"
    exit 1
}

scripts/diff-package $name_dash --quiet && {
    print -Pu2 "%F{red}✗ Package $name_dash has already been published but has different versions, exiting%f"
    print -Pu2 "%F{red}    | published_version : $published_version%f"
    print -Pu2 "%F{red}    | local_version     : $local_version%f"
    exit 1
}


# existsing dists for the current version
version_dists=(packages/${name_dash}/dist/${name_under}-${local_version}*(N))
if [[ ${version_dists} ]]; then
    print -Pu2 "%F{yellow}existing dists found, bumping patch and building%f"
    mise run bump-patch $name_dash
    # get the new version
    local_version=$(mise run current-version $name_dash)
fi

print -Pu2 "%F{yellow}building $name_dash for version $local_version...%f"
mise run build-package $name_dash

print -Pu2 "%F{yellow}publishing $name_dash for version $local_version...%f"
uv publish \
    packages/${name_dash}/dist/${name_under}-${local_version}*.whl \
    packages/${name_dash}/dist/${name_under}-${local_version}*.tar.gz

print -Pu2 "%F{yellow}waiting for $name_dash $local_version to be published...%f"
until [[ $(mise run published-version $name_dash) == $local_version ]]; do
    sleep 1
    print -Pu2 "%F{yellow}.%f"
done
print -Pu2 "%F{green}✓ published $name_dash $local_version%f"

uvx $name_dash@latest _noop >/dev/null 2>&1 || true
"""

[tasks.publish-from-dist]
description = "Publish a specific package from dist directory without building (e.g., mise run publish-from-dist string)"
run = """#!/usr/bin/env zsh
package_name="we_love_$1"
uv publish dist/${package_name}-*.whl dist/${package_name}-*.tar.gz
"""

[tasks.publish-all]
description = "Build and publish all packages to PyPI"
depends = ["build"]
run = """#!/usr/bin/env zsh
echo "Publishing all packages..."
uv publish dist/*
"""

[tasks.publish-all-from-dist]
description = "Publish all packages from dist directory to PyPI (without building)"
run         = "uv publish dist/*"

[tasks.check-pypi]
description = "Check if a package in dist already exists on PyPI using SHA256 checksums (e.g., mise run check-pypi string)"
run = """#!/usr/bin/env zsh
uv run scripts/check_package_pypi.py we-love-$1
"""

[tasks.check-pypi-strict]
description = "Check if a package exists on PyPI and exit with error if it does (e.g., mise run check-pypi-strict string)"
run = """#!/usr/bin/env zsh
uv run scripts/check_package_pypi.py we-love-$1 --exit-code
"""

[tasks.clean]
run = """#!/usr/bin/env zsh
rm -rf dist .venv .pytest_cache .ruff_cache **/*.egg-info
"""

[tasks.new-package]
description = "Create a new package"
run = """#!/usr/bin/env zsh
# Force use of local development packages
uv run --with-editable ./packages/we-love-pyproject scripts/update_we_love_config.py --create "$1" --description "$2"
"""

[[watch_files]]
patterns = ["packages/*/pyproject.toml"]
run      = "mise run uv-sync-changed"

[tasks.uv-sync-changed]
description = "Sync changes to uv workspace"
dir = "{{ config_root }}"
run = """#!/usr/bin/env zsh
typeset -T MISE_WATCH_FILES_MODIFIED mise_watch_files_modified

for file in packages/*/pyproject.toml ; do
    pdir=${file:h}
    [[ -d $pdir ]] || exit 1
    [[ ! -d ${pdir}/.venv ]] && {
        print -u2 "+> ⚠️ missing .venv in '${pdir:t}', syncing"
        uv sync --directory ${pdir} || {
            print -u2 "+> 🚨 uv sync failled, cleaning"
            rm -rf ${pdir}/.venv
        }
    }
done

for file in $mise_watch_files_modified; do
    [[ $file == */pyproject.toml ]] && {
        pdir=${file:h}
        print -u2 "+> ℹ️ pyproject.toml changed, syncing ${pdir:t}"
        uv sync --directory ${pdir} || {
            print -u2 "+> 🚨 uv sync failled, cleaning"
            rm -rf ${pdir}/.venv
        }
    }
done
"""
