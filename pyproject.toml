[tool.ruff]
line-length = 140
preview = true
target-version = "py313"
lint.select = ["ALL"]
lint.ignore = [
    # Ruff format owns layout; generated upstream schemas contain long descriptions.
    "missing-trailing-comma", "prohibited-trailing-comma", "single-line-implicit-string-concatenation", "line-too-long",
    # Public APIs retain their argument order and direct error messages.
    "FBT", "EM", "raise-vanilla-args", "too-many-arguments", "too-many-positional-arguments", "builtin-argument-shadowing",
    # Documentation and copyright policies are separate from correctness checks.
    "D", "DOC", "missing-copyright-notice",
    # Namespace distributions deliberately omit we_love/__init__.py.
    "implicit-namespace-package", "invalid-module-name", "non-empty-init-module",
    # Data-heavy schemas and rendering routines use many branches and numeric constants.
    "complex-structure", "too-many-return-statements", "too-many-branches", "too-many-locals", "too-many-statements", "too-many-boolean-expressions", "magic-value-comparison", "no-self-use",
    # CLI output, invariant assertions, deterministic artwork, and argument-vector subprocesses are intentional.
    "print", "assert", "suspicious-non-cryptographic-random-usage", "suspicious-subprocess-import", "subprocess-without-shell-equals-true",
    # Framework callbacks have prescribed names and unused context parameters.
    "unused-function-argument", "unused-method-argument", "non-lowercase-variable-in-function", "pep484-style-positional-only-parameter",
    # Catch/report at CLI and optional I/O boundaries; keep the original traceback.
    "blind-except", "too-many-statements-in-try-clause", "try-consider-else",
    # Existing public rendering and serialization behavior.
    "ambiguous-unicode-character-string", "float-equality-comparison", "eq-without-hash", "uncapitalized-environment-variables",
]

# specific fixes to be more aggressive with
lint.extend-safe-fixes = [
    "FA",
    "future-required-type-annotation", # Add 'from __future__ import annotations' import
    "TC",
    "UP",
]
# classes that require runtime evaluation of their type annotations.
# e.g. pydantic.BaseModel types will be kept as real imports and not TYPE_CHECKING guarded
lint.flake8-type-checking.runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

lint.future-annotations = true

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["debugger", "shebang-not-executable", "shebang-missing-executable-file"]
"**/_dap.py" = ["debugger"]
# These settings explicitly implement an opt-in debugger.
"**/pydantic/cli.py" = ["debugger"]
# Generated enum values mirror upstream Ruff rule prefixes.
"**/pyproject/_ruff.py" = ["ambiguous-variable-name"]

[tool.pyproject-fmt]
column_width = 1          # always wrap lists
indent = 4
keep_full_version = false # remove unnecessary trailing ``.0``'s from version specifiers

[tool.pytest.ini_options]
addopts = [
    "-vv",
    "-ra",
    "-p no:ddtrace",
    "-p no:ddtrace.pytest_bdd",
    "-p no:ddtrace.pytest_benchmark",
]
anyio_mode = "auto"
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
    "ignore::DeprecationWarning:__main__",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_level = "DEBUG"
testpaths = [
    "packages",
]

[tool.pyright]
venv = ".venv"
venvPath = "."
exclude = [
    "**/__pycache__",
    "**/.venv",
]
pythonVersion = "3.15"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportDuplicateImport = "error"
reportImportCycles = "error"
reportIncompatibleMethodOverride = "error"
reportInconsistentConstructor = "error"
reportInvalidTypeVarUse = "error"
reportMatchNotExhaustive = "error"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "error"
reportPrivateImportUsage = "error"
reportSelfClsParameterName = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUnusedImport = "error"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
typeCheckingMode = "strict"

reportImplicitOverride = "error"
enableTypeIgnoreComments = false
extraPaths = ["packages/we-love-alfred/src", "packages/we-love-avatars/src", "packages/we-love-cli/src", "packages/we-love-funcy/src", "packages/we-love-fzf/src", "packages/we-love-matchbox/src", "packages/we-love-pydantic/src", "packages/we-love-pyproject/src", "packages/we-love-registry/src", "packages/we-love-string/src", "packages/we-love-typeid/src"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.15"
extra-paths = ["packages/we-love-alfred/src", "packages/we-love-avatars/src", "packages/we-love-cli/src", "packages/we-love-funcy/src", "packages/we-love-fzf/src", "packages/we-love-matchbox/src", "packages/we-love-pydantic/src", "packages/we-love-pyproject/src", "packages/we-love-registry/src", "packages/we-love-string/src", "packages/we-love-typeid/src"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "ty>=0.0.95",
    "types-tqdm",
    "types-requests",
    "click",
    "requests",
    "debugpy",
    "packaging",
]

[tool.uv.workspace]
members = ["packages/we-love-*"]

[tool.uv.sources]
we-love-alfred = { workspace = true }
we-love-avatars = { workspace = true }
we-love-cli = { workspace = true }
we-love-funcy = { workspace = true }
we-love-fzf = { workspace = true }
we-love-matchbox = { workspace = true }
we-love-pydantic = { workspace = true }
we-love-pyproject = { workspace = true }
we-love-registry = { workspace = true }
we-love-string = { workspace = true }
we-love-typeid = { workspace = true }
