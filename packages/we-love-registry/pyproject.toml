[build-system]
build-backend = "uv_build"

requires = ["uv-build>=0.8,<0.9"]

[project]
name = "we-love-registry"
version = "0.2.0"
description = "Registry and autodiscovery utilities for the we-love namespace"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["we-love-string>=0.2.0", "pydantic>=2"]

[tool.uv.sources]
we-love-string = { workspace = true }

[tool.uv.build-backend]
namespace   = true
module-name = "we_love"


[dependency-groups]
dev = ["pytest>=9"]
