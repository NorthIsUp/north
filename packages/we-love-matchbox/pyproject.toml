[build-system]
build-backend = "uv_build"

requires = ["uv-build>=0.8,<0.9"]

[project]
name = "we-love-matchbox"
version = "0.3.0"
description = "Guards and regex value patterns for structural match statements"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[tool.uv.build-backend]
namespace   = true
module-name = "we_love"


[dependency-groups]
dev = ["pytest>=9"]
