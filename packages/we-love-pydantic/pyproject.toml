[build-system]
build-backend = "uv_build"

requires = ["uv-build>=0.8,<0.9"]

[project]
name = "we-love-pydantic"
version = "0.1.0"
description = "Pydantic utilities for the we-love namespace"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pydantic>=2", "we-love-cli"]

[tool.uv.sources]
we-love-cli = { workspace = true }

[tool.uv.build-backend]
namespace   = true
module-name = "we_love"


[dependency-groups]
dev = ["pytest>=9"]
