[project]
name            = "we-love-alfred"
version         = "0.5.9"
description     = "help make alfred commands nice for we-love namespace"
requires-python = ">=3.15"
dependencies    = ["pydantic>=2", "httpx", "anyio", "asyncstdlib"]

[build-system]
requires      = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace   = true
module-name = "we_love"


[dependency-groups]
dev = ["pytest>=9"]
